name: Sync upstream

on:
  schedule:
    # 每天 UTC 18:00（北京时间次日 02:00）自动检查上游更新
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'Anomi-oo/wow-origin'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Merge upstream (keep local files)
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Anomi-oo/wow-origin.git 2>/dev/null \
            || git remote set-url upstream https://github.com/Anomi-oo/wow-origin.git
          git fetch --no-tags upstream main

          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date with Anomi-oo/wow-origin main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # 合并而非整棵替换：保留 public/ 下自加的音源文件与本地提交。
          # 冲突时本步骤失败、不推送，线上保持原状，需人工解决后再同步。
          git merge --no-edit -m "chore: sync upstream $(date -u +%Y-%m-%dT%H:%MZ)" FETCH_HEAD
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Merged Anomi-oo/wow-origin main (local files kept)." >> "$GITHUB_STEP_SUMMARY"
      - name: Trigger deploy
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "${{ github.event.repository.default_branch }}"
